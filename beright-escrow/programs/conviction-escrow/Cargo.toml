[package]
name = "conviction-escrow"
version = "0.1.0"
description = "BeRight Conviction Escrow - Projects stake SOL on their milestones"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "conviction_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
blake3 = { workspace = true }
indexmap = { workspace = true }
proc-macro-crate = { workspace = true }
