[package]
name = "forecast-vault"
version = "0.1.0"
description = "BeRight Forecast Vault Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "forecast_vault"

[features]
default = []
cpi = ["no-entrypoint"]
init-if-needed = ["anchor-lang/init-if-needed"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32", features = ["init-if-needed"] }
anchor-spl = "0.32"
calibration = { path = "../../../calibration-program/programs/calibration", features = ["cpi"] }
