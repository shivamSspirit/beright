[package]
name = "calibration"
version = "0.1.0"
description = "BeRight Forecaster Calibration Tracking Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "calibration"

[features]
default = []
cpi = ["no-entrypoint"]
init-if-needed = ["anchor-lang/init-if-needed"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32", features = ["init-if-needed"] }
# Force compatible versions for rustc 1.79.0-dev
indexmap = "=2.2.6"  # Last version supporting rustc 1.79
proc-macro-crate = "=3.1.0"  # Compatible with rustc 1.79
# Compression dependencies temporarily disabled for build compatibility
# spl-account-compression = "0.4.0"
# spl-noop = "0.2.1"

[dev-dependencies]
# solana-program-test = "~1.18"
# solana-sdk = "~1.18"
