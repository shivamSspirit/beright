[toolchain]
anchor_version = "0.32.0"
solana_version = "2.1.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
staking_pool = "Fkb7q8pbMa4Wko4u1DYZMXBrXvq8ECFnSqze2TYMm4pM"

[programs.devnet]
staking_pool = "Fkb7q8pbMa4Wko4u1DYZMXBrXvq8ECFnSqze2TYMm4pM"

[programs.mainnet]
staking_pool = "Fkb7q8pbMa4Wko4u1DYZMXBrXvq8ECFnSqze2TYMm4pM"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
