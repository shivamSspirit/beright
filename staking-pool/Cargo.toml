[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.dependencies]
anchor-lang = "0.32.0"
anchor-spl = "0.32.0"
# Pin to avoid edition2024 requirement in newer versions
blake3 = "=1.5.5"
indexmap = "=2.7.1"
proc-macro-crate = "=3.2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
