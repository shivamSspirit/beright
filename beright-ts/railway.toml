[build]
builder = "nixpacks"
buildCommand = "npm install && NODE_OPTIONS='--max-old-space-size=3584' npm run build"

[deploy]
startCommand = "npx pm2-runtime start ecosystem.railway.config.cjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
